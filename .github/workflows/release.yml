name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - name: Build
        run: node scripts/build.mjs

      - name: Zip the extension
        run: cd dist/extension && zip -r ../copyright-bypass-skip-extension.zip .

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/copyright-bypass-skip.js
          dist/copyright-bypass-skip-extension.zip
          --title "$GITHUB_REF_NAME"
          --generate-notes
